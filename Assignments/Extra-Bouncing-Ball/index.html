<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p>ASSIGNMENT 01</p>
      <h1>Bouncing Ball</h1>
    </header>

    <section class="stage" aria-label="Bouncing ball animation">
      <div class="ball" id="ball"></div>
      <div class="shadow" id="shadow"></div>
      <div class="floor"></div>
    </section>

    <section class="controls" aria-label="Animation controls">
      <button id="toggle-button" type="button">Pause</button>
      <button id="restart-button" type="button">Restart</button>
      <label for="speed-control">
        Speed
        <input id="speed-control" type="range" min="0.5" max="2" value="1" step="0.1">
      </label>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
